name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The project claims support for PHP 8.2 and up, so every supported minor is
    # exercised. 8.2 is the floor and the only version that runs the coverage
    # gate: the tier-2 ratchet compares against a single committed floor file,
    # so letting several matrix jobs evaluate it would race.
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: pms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, mbstring
          coverage: pcov

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      # --no-scripts: post-install-cmd runs bin/install.php, which only drives npm.
      # The test job needs no compiled CSS.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      # config.platform.php pins resolution to 8.2.0 so the lock file can never
      # contain a package that the 8.2 floor cannot install. This asserts the
      # installed set really does satisfy the running interpreter.
      - name: Verify platform requirements
        run: composer check-platform-reqs

      # phinx.php's `testing` environment appends "_test" to DB_NAME, so DB_NAME
      # must be "pms" here for migrations to land in the "pms_test" database that
      # phpunit.xml connects to.
      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1:3306/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=pms/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready"; exit 1

      - name: Run migrations against the test database
        run: vendor/bin/phinx migrate -e testing

      # --fail-on-skipped is deliberate and CI-only. MySQL is provisioned above,
      # so an integration test that skips here is a broken harness, not a local
      # convenience. Developers without MySQL still get graceful skips because
      # the flag is not in phpunit.xml.
      - name: Run test suite with coverage
        run: vendor/bin/phpunit --testdox --fail-on-skipped --coverage-clover coverage.xml

      # Only the 8.2 job gates. See the matrix comment above.
      - name: Enforce tiered coverage gate
        if: matrix.php-version == '8.2'
        run: php bin/coverage-gate.php

      - name: Upload coverage report
        if: always() && matrix.php-version == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Linux tracks src/Views/Projects and src/Views/projects as two files;
      # Windows and macOS can only hold one, so the other silently rots and
      # shows up as a phantom modification. The whole Projects view directory
      # had drifted this way before anyone noticed.
      - name: Reject paths that differ only by case
        run: |
          collisions=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "Tracked paths differing only by case (breaks case-insensitive checkouts):"
            echo "$collisions"
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Check PSR-12 compliance
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # public/assets/css/styles.css is tracked on purpose, so Node-less shared
      # hosting works. The cost is that a view change is only half a change
      # until the stylesheet is rebuilt, and a missing utility is invisible on
      # a dev machine that ran `npm run build` at some point. The installer
      # views shipped without their warning styles - the yellow border and
      # dark-mode background on the exposure step's "could not verify" - for
      # exactly this reason.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compiled CSS matches the views
        run: |
          npm install --no-audit --no-fund
          npm run build
          if ! git diff --exit-code -- public/assets/css/styles.css; then
            echo
            echo "public/assets/css/styles.css is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Audit dependencies for known advisories
        run: composer audit

