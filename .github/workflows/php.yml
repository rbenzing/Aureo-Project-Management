name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The project claims support for PHP 8.2 and up, so every supported minor is
    # exercised. 8.2 is the floor and the only version that runs the coverage
    # gate: the tier-2 ratchet compares against a single committed floor file,
    # so letting several matrix jobs evaluate it would race.
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: pms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, mbstring
          coverage: pcov

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      # --no-scripts: post-install-cmd runs bin/install.php, which only drives npm.
      # The test job needs no compiled CSS.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      # config.platform.php pins resolution to 8.2.0 so the lock file can never
      # contain a package that the 8.2 floor cannot install. This asserts the
      # installed set really does satisfy the running interpreter.
      - name: Verify platform requirements
        run: composer check-platform-reqs

      # phinx.php's `testing` environment appends "_test" to DB_NAME, so DB_NAME
      # must be "pms" here for migrations to land in the "pms_test" database that
      # phpunit.xml connects to.
      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1:3306/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=pms/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready"; exit 1

      - name: Run migrations against the test database
        run: vendor/bin/phinx migrate -e testing

      # --fail-on-skipped is deliberate and CI-only. MySQL is provisioned above,
      # so an integration test that skips here is a broken harness, not a local
      # convenience. Developers without MySQL still get graceful skips because
      # the flag is not in phpunit.xml.
      - name: Run test suite with coverage
        run: vendor/bin/phpunit --testdox --fail-on-skipped --coverage-clover coverage.xml

      # Only the 8.2 job gates. See the matrix comment above.
      - name: Enforce tiered coverage gate
        if: matrix.php-version == '8.2'
        run: php bin/coverage-gate.php

      - name: Upload coverage report
        if: always() && matrix.php-version == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Linux tracks src/Views/Projects and src/Views/projects as two files;
      # Windows and macOS can only hold one, so the other silently rots and
      # shows up as a phantom modification. The whole Projects view directory
      # had drifted this way before anyone noticed.
      - name: Reject paths that differ only by case
        run: |
          collisions=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "Tracked paths differing only by case (breaks case-insensitive checkouts):"
            echo "$collisions"
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Check PSR-12 compliance
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Audit dependencies for known advisories
        run: composer audit

  smoke:
    runs-on: ubuntu-latest

    # Both supported layouts, from the actual release archive rather than a
    # git checkout. Part 1 shipped two layouts and nothing verified either of
    # them end to end; this is that verification.
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: docroot-public
            docroot: public
            asset_path: /assets/css/styles.css
          - layout: drop-in
            docroot: .
            asset_path: /public/assets/css/styles.css

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: aureo_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the release archive
        run: |
          composer install --no-dev --optimize-autoloader --no-progress --no-scripts
          npm install
          npm run build
          php bin/build-release.php

      - name: Extract the archive
        run: |
          mkdir -p /tmp/site
          unzip -q dist/aureo-*.zip -d /tmp/site
          ls /tmp/site/aureo

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && exit 0
            sleep 2
          done
          echo "MySQL never became ready"; exit 1

      # The web installer is exercised by its unit tests; driving a six-step
      # form from bash would test curl, not the application. What this job
      # needs is a configured site, and bin/setup.php is the supported
      # non-interactive path to one - it also writes installed.lock, which is
      # itself part of what we are asserting.
      - name: Configure the site
        working-directory: /tmp/site/aureo
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/^APP_SCHEME=.*/APP_SCHEME=http/' .env
          sed -i 's/^SESSION_SECURE=.*/SESSION_SECURE=false/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1:3306/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=aureo_smoke/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env
          php bin/setup.php --yes --no-sample-data

      - name: Assert the installer locked itself
        working-directory: /tmp/site/aureo
        run: test -f config/installed.lock || (echo "bin/setup.php did not write config/installed.lock"; exit 1)

      - name: Start the site (${{ matrix.layout }})
        working-directory: /tmp/site/aureo
        run: |
          php -S 127.0.0.1:8080 -t "${{ matrix.docroot }}" >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sS -o /dev/null "http://127.0.0.1:8080/login" && exit 0
            sleep 1
          done
          echo "Server never came up:"; cat /tmp/php-server.log; exit 1

      - name: Assert the site responds
        run: |
          chmod +x .github/smoke/expect.sh
          .github/smoke/expect.sh "http://127.0.0.1:8080/login" 200 "Aureo"
          .github/smoke/expect.sh "http://127.0.0.1:8080${{ matrix.asset_path }}" 200

      # The single most common drop-in failure: the page renders but every
      # asset URL is wrong, so the site is unstyled and reads as broken. Assert
      # the URL in the HTML matches the layout, not merely that some
      # stylesheet is reachable.
      - name: Assert the stylesheet URL matches the layout
        run: .github/smoke/expect.sh "http://127.0.0.1:8080/login" 200 "${{ matrix.asset_path }}"

      # A locked installation must never expose /install, whatever the layout.
      - name: Assert the installer is unreachable on a locked site
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/install")
          case "$status" in
            200) echo "FAIL: /install is reachable on a locked installation"; exit 1 ;;
            *)   echo "ok    /install -> $status" ;;
          esac

      - name: Server log on failure
        if: failure()
        run: cat /tmp/php-server.log

  hardening:
    runs-on: ubuntu-latest

    # Only real Apache honours .htaccess - php -S ignores it entirely, so the
    # smoke job above proves nothing about the deny rules. This job exists
    # because Part 1 shipped a RedirectMatch that was silently inert, and
    # nothing would have caught it.
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and extract the release archive
        run: |
          composer install --no-dev --optimize-autoloader --no-progress --no-scripts
          npm install
          npm run build
          php bin/build-release.php
          mkdir -p /tmp/site
          unzip -q dist/aureo-*.zip -d /tmp/site

      # The archive omits these by design. Recreate them so the deny rules are
      # tested against files that actually exist - Apache returning 404 for an
      # absent file proves nothing about whether it would have served a
      # present one.
      - name: Plant the files the deny rules are supposed to hide
        run: |
          cd /tmp/site/aureo
          printf 'DB_PASSWORD=hunter2\n' > .env
          mkdir -p .git log config
          printf '[core]\n\trepositoryformatversion = 0\n' > .git/config
          printf 'log line\n' > log/aureo.log
          printf '<?php return ["DB_PASSWORD" => "hunter2"];\n' > config/config.php

      # Drop-in layout: the document root IS the application root, which is the
      # only layout where these rules matter at all.
      - name: Serve the drop-in layout under Apache
        run: |
          docker run -d --name aureo-apache \
            -v /tmp/site/aureo:/var/www/html \
            -p 8081:80 \
            php:8.2-apache \
            bash -c "a2enmod rewrite && sed -ri 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf && apache2-foreground"
          for i in $(seq 1 30); do
            curl -sS -o /dev/null "http://127.0.0.1:8081/" && break
            sleep 2
          done

      - name: Assert every sensitive path is denied
        run: |
          chmod +x .github/smoke/expect.sh
          fail=0
          for path in /.env /.Env /.ENV /.git/config /.Git/config /config/config.php /log/aureo.log /composer.json /VERSION /phinx.php /src/Core/Config.php /db/migrations; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$path")
            if [ "$status" = "200" ]; then
              echo "FAIL  $path is publicly readable (200)"
              fail=1
            else
              echo "ok    $path -> $status"
            fi
          done
          exit $fail

      - name: Apache log on failure
        if: failure()
        run: docker logs aureo-apache
